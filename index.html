<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Roulette</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #videos {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 800px;
      flex: 1;
      justify-content: center;
    }
    .video-container {
      position: relative;
      background: #222;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      max-width: 640px;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }
    #localVideoContainer { max-width: 320px; aspect-ratio: 4/3; }
    #remoteVideoContainer { max-width: 640px; aspect-ratio: 4/3; }
    #controls {
      display: flex;
      gap: 15px;
      margin: 20px 0;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 30px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      background: #3a6b8f;
      color: #fff;
      min-width: 120px;
    }
    button:hover { opacity: 0.8; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #startBtn { background: #2e7d32; }
    #stopBtn { background: #c62828; }
    #skipBtn { background: #f57c00; }
    #status {
      margin: 10px;
      padding: 8px 16px;
      background: #222;
      border-radius: 20px;
      font-size: 14px;
    }
    footer {
      margin-top: 20px;
      padding: 10px;
      font-size: 14px;
      color: #888;
    }
    footer a { color: #4fc3f7; text-decoration: none; }
    footer a:hover { text-decoration: underline; }
    .placeholder-text { color: #666; font-size: 18px; }
    .label {
      position: absolute;
      bottom: 8px;
      left: 12px;
      background: rgba(0,0,0,0.6);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 12px;
    }
    #localVideoContainer .label { color: #aaf; }
    #remoteVideoContainer .label { color: #faa; }
    #remotePlaceholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #666;
      font-size: 20px;
    }
    @media (max-width: 600px) {
      #localVideoContainer { max-width: 200px; }
      #controls button { min-width: 80px; padding: 10px 16px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <div id="videos">
    <div id="localVideoContainer" class="video-container">
      <video id="localVideo" autoplay muted></video>
      <span class="label">Вы</span>
    </div>
    <div id="remoteVideoContainer" class="video-container">
      <video id="remoteVideo" autoplay></video>
      <span class="label">Собеседник</span>
      <div id="remotePlaceholder">Ожидание собеседника...</div>
    </div>
  </div>

  <div id="status">Статус: Не в поиске</div>
  <div id="controls">
    <button id="startBtn">Начать поиск</button>
    <button id="skipBtn" disabled>Скип</button>
    <button id="stopBtn" disabled>Остановить</button>
  </div>

  <footer>
    By <a href="https://t.me/fxzlol" target="_blank">fxz.lol</a>
  </footer>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/simple-peer/9.11.1/simplepeer.min.js"></script>
  <script>
    // ----- DOM -----
    const localVideo = document.getElementById('localVideo');
    const remoteVideo = document.getElementById('remoteVideo');
    const remotePlaceholder = document.getElementById('remotePlaceholder');
    const statusDiv = document.getElementById('status');
    const startBtn = document.getElementById('startBtn');
    const skipBtn = document.getElementById('skipBtn');
    const stopBtn = document.getElementById('stopBtn');

    let socket, localStream, peer = null;
    let partnerId = null, roomId = null;
    let isSearching = false, isConnected = false;

    // ----- Медиа -----
    async function getMedia() {
      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
        localVideo.srcObject = localStream;
      } catch (err) {
        alert('Ошибка доступа к камере/микрофону: ' + err.message);
      }
    }

    // ----- Сокет -----
    function initSocket() {
      socket = io();

      socket.on('connect', () => {
        console.log('Socket connected');
        updateStatus('Подключено');
      });

      socket.on('search-status', (data) => {
        if (data.status === 'waiting') {
          isSearching = true;
          updateStatus('Поиск собеседника...');
        } else {
          isSearching = false;
          updateStatus('Поиск остановлен');
        }
        updateButtons();
      });

      socket.on('matched', ({ partnerId: partner, room }) => {
        partnerId = partner;
        roomId = room;
        isSearching = false;
        isConnected = true;
        updateStatus('Собеседник найден!');
        remotePlaceholder.style.display = 'none';
        createPeer(partnerId, roomId, true);
        updateButtons();
      });

      socket.on('offer', ({ from, offer, room }) => {
        if (!peer) createPeer(from, room, false);
        peer.signal(offer);
      });

      socket.on('answer', ({ from, answer, room }) => {
        if (peer) peer.signal(answer);
      });

      socket.on('ice-candidate', ({ from, candidate, room }) => {
        if (peer) peer.signal(candidate);
      });

      socket.on('partner-disconnected', () => {
        if (peer) { peer.destroy(); peer = null; }
        isConnected = false;
        partnerId = null;
        roomId = null;
        remoteVideo.srcObject = null;
        remotePlaceholder.style.display = 'flex';
        updateStatus('Собеседник ушёл. Ищем нового...');
        startSearch();
      });

      socket.on('disconnect', () => {
        alert('Соединение с сервером потеряно. Обновите страницу.');
        stopAll();
      });
    }

    // ----- Peer -----
    function createPeer(partner, room, initiator) {
      if (peer) { peer.destroy(); peer = null; }
      peer = new SimplePeer({
        initiator,
        trickle: true,
        stream: localStream,
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
      });

      peer.on('signal', (data) => {
        const event = initiator ? 'offer' : 'answer';
        socket.emit(event, { to: partner, [event]: data, room });
      });

      peer.on('stream', (stream) => {
        remoteVideo.srcObject = stream;
        remotePlaceholder.style.display = 'none';
      });

      peer.on('close', () => {
        peer = null;
        remoteVideo.srcObject = null;
        remotePlaceholder.style.display = 'flex';
        isConnected = false;
        partnerId = null;
        roomId = null;
        updateStatus('Соединение закрыто');
        updateButtons();
      });

      peer.on('error', (err) => {
        console.error('Peer error:', err);
        peer.destroy();
        peer = null;
        remoteVideo.srcObject = null;
        remotePlaceholder.style.display = 'flex';
        isConnected = false;
        partnerId = null;
        roomId = null;
        updateStatus('Ошибка');
        updateButtons();
        startSearch();
      });
    }

    // ----- Действия -----
    function startSearch() {
      if (isSearching || isConnected || !socket) return;
      socket.emit('start-search');
      isSearching = true;
      updateStatus('Поиск...');
      updateButtons();
    }

    function skip() {
      if (!isConnected) return;
      socket.emit('skip');
      if (peer) { peer.destroy(); peer = null; }
      remoteVideo.srcObject = null;
      remotePlaceholder.style.display = 'flex';
      isConnected = false;
      partnerId = null;
      roomId = null;
      updateStatus('Скип, ищем нового...');
      updateButtons();
    }

    function stopSearch() {
      if (socket) socket.emit('stop-search');
      if (peer) { peer.destroy(); peer = null; }
      remoteVideo.srcObject = null;
      remotePlaceholder.style.display = 'flex';
      isSearching = false;
      isConnected = false;
      partnerId = null;
      roomId = null;
      updateStatus('Поиск остановлен');
      updateButtons();
    }

    function stopAll() {
      stopSearch();
      if (localStream) {
        localStream.getTracks().forEach(t => t.stop());
        localStream = null;
        localVideo.srcObject = null;
      }
      if (socket) { socket.disconnect(); socket = null; }
    }

    // ----- UI -----
    function updateStatus(msg) {
      statusDiv.textContent = 'Статус: ' + msg;
    }

    function updateButtons() {
      startBtn.disabled = isSearching || isConnected || !socket;
      skipBtn.disabled = !isConnected;
      stopBtn.disabled = !(isSearching || isConnected);
    }

    // ----- События кнопок -----
    startBtn.addEventListener('click', startSearch);
    skipBtn.addEventListener('click', skip);
    stopBtn.addEventListener('click', stopSearch);

    // ----- Инициализация -----
    (async () => {
      await getMedia();
      initSocket();
      updateButtons();
    })();

    window.addEventListener('beforeunload', stopAll);
  </script>
</body>
</html>
